name: Verify application

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@fitness/backend
      - name: Build web
        run: npm run build:web
      - name: Build API
        run: npm run build --workspace=@fitness/backend
      - name: Lint API
        run: npm run lint --workspace=@fitness/backend
      - name: Test API
        run: npm run test --workspace=@fitness/backend
