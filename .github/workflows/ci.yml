name: Verify application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run prisma:generate --workspace=@fitness/backend
      - run: npm run build:web
      - run: npm run check:mobile
      - run: npm run build --workspace=@fitness/backend
      - run: npm run lint --workspace=@fitness/backend
      - run: npm run test --workspace=@fitness/backend
