name: Diagnose failed EAS build
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/eas-diagnose-once.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --workspaces=false
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Link Expo project
        working-directory: apps/mobile
        run: eas project:init --account omarb121s-team --non-interactive
      - name: Inspect failed Expo build
        working-directory: apps/mobile
        run: eas build:view 08d1016f-0e9a-4d5e-964e-09bf73924f7d --json
