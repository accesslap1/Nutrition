services:
  - type: web
    name: fitty-nutrition-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fitty-nutrition-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CORS_ORIGINS
        value: https://fitty-nutrition.onrender.com

  - type: web
    name: fitty-nutrition
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://fitty-nutrition-api.onrender.com/api/v1

databases:
  - name: fitty-nutrition-db
    databaseName: fitty_nutrition
    user: fitty_nutrition
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
