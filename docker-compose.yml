services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["fitness-postgres:/var/lib/postgresql/data"]

volumes:
  fitness-postgres:
